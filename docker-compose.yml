services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set a random QDRANT_API_KEY}
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  claudedock-core:
    build: .
    ports:
      - "127.0.0.1:7437:7437"
    volumes:
      - ./workspace:/app/workspace
      - claudedock_state:/home/claudedock/.claudedock
    environment:
      CLAUDEDOCK_HOST: 0.0.0.0
      CLAUDEDOCK_PORT: 7437
      CLAUDEDOCK_ALLOW_REMOTE: "1"
      CLAUDEDOCK_TRUSTED_PROXY: "1"  # 容器外仅发布 loopback，公网接入必须另外配置 TLS
      CLAUDEDOCK_IPC_TOKEN: ${CLAUDEDOCK_IPC_TOKEN:?Set a random CLAUDEDOCK_IPC_TOKEN before starting Compose}
      CLAUDEDOCK_LOG_FORMAT: json
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDEDOCK_LLM_DEFAULT_MODEL: ${CLAUDEDOCK_LLM_DEFAULT_MODEL:-claude-sonnet-4-6}
      CLAUDEDOCK_RAG_QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set a random QDRANT_API_KEY}
    depends_on:
      - qdrant
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-m", "claudedock.core.transport.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  qdrant_storage:
  claudedock_state:
