# ClaudeDock 项目配置（PEP 621 + Hatch 构建 + 常用工具链）

# ---- PEP 517：声明如何构建 wheel/sdist ----
[build-system]
requires = ["hatchling==1.29.0"]          # 构建时需要的后端包
build-backend = "hatchling.build" # 使用 Hatchling 作为构建后端

# ---- 项目元数据与运行时依赖（PEP 621）----
[project]
name = "ClaudeDock"
description = "A local AI coding agent with controlled tools, persistent sessions and multi-agent collaboration"
readme = "README.md"
license = "MIT"
version = "0.0.1"
requires-python = ">=3.12,<3.13" # 仅支持 3.12 小版本范围，与 CI/类型检查一致
dependencies = [
    "jsonschema>=4.23",     # 外部工具输入的完整 JSON Schema 校验
    "pydantic>=2.0",       # 数据校验与序列化（含 JSON 模型等）
    "python-dotenv>=1.0",  # .env 文件解析
    "anthropic>=0.25",     # Anthropic LLM SDK（流式 + prompt caching）
    "textual>=0.75",       # 终端 UI 框架（claudedock-tui）
    "httpx[socks]>=0.28.1",
    "qdrant-client>=1.9",   # Qdrant 向量库（本地 local mode + 远程 server mode）
]

# 安装后可在 PATH 中执行的入口：`claudedock` / `claudedock-core` / `claudedock-tui`
[project.scripts]
claudedock = "claudedock.cli.main:main"
claudedock-core = "claudedock.core.app:run"
claudedock-tui = "claudedock.tui.__main__:main"

# ---- Hatch：打 wheel 时从 src 布局收录包 ----
[tool.hatch.build.targets.wheel]
packages = ["src/claudedock"] # 源码在 src/claudedock

# 源码包明确选择公开工程文件，避免私有状态与历史快照被打包
[tool.hatch.build.targets.sdist]
include = [
    "/src/claudedock/**", "/tests/**", "/scripts/**", "/docs/**", "/.github/**",
    "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/Makefile",
    "/Dockerfile", "/docker-compose.yml", "/.dockerignore", "/.gitignore",
    "/.editorconfig", "/.env.example", "/.python-version", "/.pre-commit-config.yaml",
    "/AGENT.md", "/CLAUDE.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/RUNBOOK.md",
    "/WIRE_PROTOCOL.md", "/build-assets/README.md",
]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]

# ---- 开发期依赖（PEP 735）----
[dependency-groups]
dev = [
    "ruff>=0.4",            # 快速 linter + import 排序等
    "mypy>=1.10",           # 静态类型检查
    "pytest>=8.0",          # 单元测试
    "pytest-asyncio>=0.23", # 异步测试支持
    "pytest-cov>=5.0",      # 测试覆盖率报告
    "bandit>=1.7",          # 安全漏洞扫描
    "pip-audit>=2.7",       # 依赖漏洞检查
]
eval = [
    "ragas>=0.2,<0.3",                   # RAG 生成层评估（LLM-as-Judge）
    "langchain>=0.2.10,<0.3",            # ragas 依赖的 langchain 元包，锁 0.2.x
    "langchain-core>=0.2.30,<0.3",       # ragas 尚未跟进 1.x，锁 0.2.x
    "langchain-community>=0.2.10,<0.3",  # 提供 langchain_community.chat_models.vertexai
    "langchain-openai>=0.1.20,<0.2",     # OpenAIEmbeddings（智谱 OpenAI 兼容端点）
]

# ---- Ruff：统一代码风格 ----
[tool.ruff]
src = ["src"]            # 分析路径，便于识别第一方代码
line-length = 100        # 行长上限
target-version = "py312" # 语法/规则按 Python 3.12

[tool.ruff.lint]
select = ["E", "F", "I", "UP"] # pycodestyle 错误、Pyflakes、isort、pyupgrade
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]   # 测试文件的中文注释允许超过行宽限制
"scripts/**/*.py" = ["E501"] # 脚本文件的文档字符串允许超过行宽限制
"src/claudedock/tui/app.py" = ["E501"]  # TUI 含 ASCII 横幅与 rich 标记字符串，允许超行宽

# ---- Mypy：严格类型检查 ----
[tool.mypy]
python_version = "3.12"
strict = true                 # 启用严格模式
mypy_path = "src"             # 将 src 加入模块搜索路径
explicit_package_bases = true # 明确包根，减少隐式命名空间误判

[[tool.mypy.overrides]]
module = "claudedock.eval.ragas_runner"
ignore_errors = true  # ragas/langchain 为可选依赖且 API 快速迭代，跳过其边界模块的类型检查

[[tool.mypy.overrides]]
module = "claudedock.core.monitoring.otel"
ignore_errors = true  # opentelemetry 为按需安装的可选依赖，未安装时无类型 stub

# ---- Pytest：默认发现 tests/，异步用例自动管理 event loop ----
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that call the real Anthropic API (require ANTHROPIC_API_KEY)",
]

# ---- Coverage.py：测试覆盖率配置 ----
[tool.coverage.run]
source = ["src/claudedock"]
branch = true
omit = [
    "*/tests/*",
    "*/eval/*",  # 评估模块为可选依赖
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true  # 动态 Schema 边界由独立回归测试验证

[tool.uv]
constraint-dependencies = ["anyio>=4.14.2,<5"]  # 依赖审计发现的 TLS/进程池问题修复下限
